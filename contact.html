<!DOCTYPE html>
<html lang="ja">

<head>
  <link rel="canonical" href="https://re-inception.com/contact.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2894543346438493"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>お問い合わせ｜株式会社INCEPTION</title>
<meta name="description" content="京都府城陽市の不動産に関するご相談・お問い合わせはこちら。売買、賃貸、住まい探しのお悩みなど、株式会社INCEPTIONへお気軽にご連絡ください。">
<meta property="og:title" content="お問い合わせ｜株式会社INCEPTION">
<meta property="og:description" content="城陽市の不動産に関するご相談はお気軽に株式会社INCEPTIONへお問い合わせください。">
<meta property="og:type" content="article">
<meta property="og:url" content="https://re-inception.com/contact.html">
<meta property="og:site_name" content="株式会社INCEPTION">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #C9A96E;
      --gold-light: #E8D5A3;
      --black: #0A0A0A;
      --white: #F5F0E8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    header {
      padding: 18px 24px;
      background: rgba(10, 10, 10, 0.95);
      border-bottom: 1px solid rgba(201, 169, 110, 0.2);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-decoration: none;
      display: inline-block;
    }

    .logo span {
      display: block;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--gold-light);
      margin-top: 2px;
    }

    .container {
      min-height: 70vh;
      padding: 80px 24px;
      text-align: center;
    }

    h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    p {
      color: rgba(245, 240, 232, 0.7);
      font-size: 14px;
      margin-bottom: 40px;
    }

    .btn-back {
      display: inline-block;
      padding: 14px 24px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.1em;
      transition: 0.3s;
    }

    .btn-back:active {
      background: var(--gold);
      color: var(--black);
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">INCEPTION<span>京都府城陽市の不動産</span></a>
  </header>
  <style>
    .form-wrapper {
      max-width: 600px;
      margin: 0 auto 40px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--gold-light);
      letter-spacing: 0.05em;
    }

    .form-group label span {
      color: #e57373;
      font-size: 11px;
      margin-left: 8px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: rgba(245, 240, 232, 0.05);
      border: 1px solid rgba(201, 169, 110, 0.3);
      color: var(--white);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      border-color: var(--gold);
      background: rgba(245, 240, 232, 0.08);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 120px;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--black);
      border: none;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 16px;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }
  </style>
  <div class="container">
    <h1>お問い合わせ</h1>
    <p style="margin-bottom: 40px;">不動産の売買、賃貸、その他に関するご質問など、<br>お気軽にお問い合わせください。</p>

    <div class="form-wrapper">
      <form name="contact_new" method="POST" action="https://formspree.io/f/YOUR_FORM_ID">
        <input type="hidden" name="_next" value="/contact_success.html">
        <div class="form-group">
          <label>お名前 <span>必須</span></label>
          <input type="text" name="name" class="form-control" placeholder="例：城陽 太郎" required>
        </div>
        <div class="form-group">
          <label>メールアドレス <span>必須</span></label>
          <input type="email" name="email" class="form-control" placeholder="例：info@example.com" required>
        </div>
        <div class="form-group">
          <label>電話番号</label>
          <input type="tel" name="tel" class="form-control" placeholder="例：090-0000-0000">
        </div>
        <div class="form-group">
          <label>お問い合わせ内容 <span>必須</span></label>
          <textarea name="message" class="form-control" placeholder="ご質問やご相談内容をご記入ください。" required></textarea>
        </div>
        <button type="submit" class="submit-btn">送信する</button>
      </form>
    </div>

    <a href="index.html" class="btn-back">トップページに戻る</a>
  </div>
</body>

</html>
