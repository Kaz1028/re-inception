<!DOCTYPE html>
<html lang="ja">

<head>
  <link rel="canonical" href="https://re-inception.com/contact_success.html">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2894543346438493"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>お問い合わせ送信完了｜株式会社INCEPTION</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Serif+JP:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --gold: #C9A96E;
      --gold-light: #E8D5A3;
      --black: #0A0A0A;
      --white: #F5F0E8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    header {
      padding: 18px 24px;
      background: rgba(10, 10, 10, 0.95);
      border-bottom: 1px solid rgba(201, 169, 110, 0.2);
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--gold);
      text-decoration: none;
      display: inline-block;
    }

    .logo span {
      display: block;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 9px;
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--gold-light);
      margin-top: 2px;
    }

    .container {
      min-height: 70vh;
      padding: 80px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    p {
      color: rgba(245, 240, 232, 0.7);
      font-size: 14px;
      margin-bottom: 40px;
      max-width: 600px;
      line-height: 1.8;
    }

    .btn-back {
      display: inline-block;
      padding: 14px 40px;
      border: 1px solid var(--gold);
      color: var(--gold);
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.1em;
      transition: 0.3s;
      background: transparent;
      cursor: pointer;
    }

    .btn-back:hover, .btn-back:active {
      background: var(--gold);
      color: var(--black);
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">INCEPTION<span>京都府城陽市の不動産</span></a>
  </header>
  <div class="container">
    <h1>お問い合わせ送信完了</h1>
    <p>
      お問い合わせいただきありがとうございます。<br>
      ご入力いただいた内容は無事に送信されました。<br><br>
      担当者より内容を確認のうえ、折り返しご連絡を差し上げますので、<br>
      今しばらくお待ちくださいますようお願い申し上げます。
    </p>
    <a href="index.html" class="btn-back">トップページに戻る</a>
  </div>
</body>

</html>
